[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitr8der"
dynamic = ["version"]
description = "Local AI-operated trading studio for Kalshi 15-minute binary markets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Paulie Studios"}]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.28,<1",
    "websockets>=12,<14",
    "aiosqlite>=0.20,<1",
    "orjson>=3.10,<4",
    "python-dotenv>=1,<2",
    "cryptography>=42,<44",
]

[project.scripts]
arbitr8der = "arbitr8der.cli.application_main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arbitr8der*"]

[tool.setuptools.dynamic]
version = {attr = "arbitr8der.version_identifier.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM", "RUF100"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "network: marks tests that make network calls",
]
