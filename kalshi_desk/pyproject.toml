[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi_desk"
version = "0.1.0"
description = "ARBITR8DER local AI trading studio for Kalshi 15-minute binary markets"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Paulie Studios"}]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.28,<1",
    "websockets>=12,<14",
    "aiosqlite>=0.20,<1",
    "orjson>=3.10,<4",
    "python-dotenv>=1,<2",
    "cryptography>=42,<44",
    "ta>=0.11,<1",
    "lightgbm>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
arbitr8der = "kalshi_desk_package.cli.cli_application_entrypoint_main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kalshi_desk_package*"]

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM", "RUF100"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "network: marks tests that make network calls",
    "asyncio: marks tests that run with pytest-asyncio",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
